# CSE3069_TH05 - Phase 2 development broker

# Listen on all network interfaces so the ESP32 can connect through the
# laptop's LAN IPv4 address. Windows Firewall still controls external access.
listener 1883 0.0.0.0
protocol mqtt

# Simple lab setup. Do not expose this broker to the public Internet.
allow_anonymous true

# Phase 2 only verifies message transport. Application data persistence will
# be implemented later in SQLite, not in the MQTT broker.
persistence false

# Print connection and message diagnostics in the terminal.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true

